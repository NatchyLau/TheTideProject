<div
  id="{{ id }}"
  class="map-pane absolute inset-0 transition-opacity duration-500 {% if active %}opacity-100 z-10{% else %}opacity-0 z-0 pointer-events-none{% endif %}"
>
  <iframe
    title="{{ title }}"
    class="w-full h-full"
    loading="lazy"
    src="{{ src }}"
  >
  </iframe>

  <div
    class="absolute bottom-6 left-6 bg-white/90 backdrop-blur-md px-5 py-4 rounded-lg border-l-4 border-accent-gold shadow-lg"
  >
    <p
      class="text-[10px] text-accent-gold uppercase tracking-widest font-bold mb-1"
    >
      Location
    </p>
    <p class="text-premium-900 font-serif text-lg mb-3">{{ location_name }}</p>

    <a
      href="https://www.google.com/maps/dir/?api=1&destination={{ destination }}"
      target="_blank"
      class="inline-flex items-center gap-2 text-xs font-bold text-slate-500 hover:text-accent-gold transition-colors group/btn"
    >
      <div
        class="w-8 h-8 rounded-full bg-slate-100 group-hover/btn:bg-accent-gold group-hover/btn:text-white flex items-center justify-center transition-colors"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
          ></path>
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
          ></path>
        </svg>
      </div>
      <span>Get Directions</span>
    </a>
  </div>
</div>
