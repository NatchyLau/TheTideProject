<button
  onclick="switchMap('{{ target }}')"
  class="location-tab {% if active %}active bg-white shadow-sm border-slate-200{% else %}bg-transparent border-transparent{% endif %} group w-full text-left p-4 rounded-xl border hover:border-accent-gold/50 hover:bg-white hover:shadow-sm transition-all duration-300 flex items-center justify-between"
  data-target="{{ target }}"
>
  <div class="flex items-center gap-4">
    <div
      class="w-10 h-10 rounded-full flex items-center justify-center transition-colors shadow-sm {% if active %}bg-accent-gold text-white{% else %}bg-slate-100 text-slate-400 group-hover:text-accent-gold{% endif %}"
    >
      <span class="font-serif font-bold text-lg">{{ number }}</span>
    </div>
    <div>
      <h4
        class="text-premium-900 font-medium group-[.active]:text-accent-gold transition-colors"
      >
        {{ title }}
      </h4>
      <p class="text-xs text-slate-500">{{ subtitle }}</p>
    </div>
  </div>
  <svg
    class="w-5 h-5 text-slate-400 group-[.active]:text-accent-gold opacity-0 group-[.active]:opacity-100 transition-all duration-300"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M9 5l7 7-7 7"
    ></path>
  </svg>
</button>
