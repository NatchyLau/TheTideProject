<a href="{{ url }}" class="group relative block h-full overflow-hidden rounded-sm bg-slate-800 transition-transform duration-500 hover:-translate-y-2 reveal {{ delay }}">
  
  <div class="relative aspect-[4/5] overflow-hidden">
    
    <img src="{{ image }}" alt="{{ title }}" 
         class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-110 
         {% if sold_out %}grayscale opacity-60{% endif %}">
    
    {% if sold_out %}
    <div class="absolute inset-0 z-20 flex items-center justify-center bg-slate-900/60 backdrop-blur-[2px]">
        <div class="relative transform -rotate-12 border-y-2 border-slate-400/30 bg-slate-900/80 py-4 px-10 shadow-2xl backdrop-blur-md">
            <span class="font-serif text-3xl font-medium tracking-[0.25em] text-slate-300 uppercase opacity-90">
                Sold Out
            </span>
        </div>
    </div>
    {% endif %}

    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/20 to-transparent opacity-90 transition-opacity duration-500 group-hover:opacity-80"></div>
  </div>

  <div class="absolute bottom-0 left-0 w-full p-8 {% if sold_out %}opacity-50{% endif %}">
    <h3 class="font-serif text-2xl text-white mb-2 leading-tight">{{ title|safe }}</h3>
    <p class="text-xs font-light text-slate-400 mb-6 line-clamp-2">{{ description|safe }}</p>
    
    <div class="flex items-center justify-between border-t border-white/10 pt-4">
      <span class="text-accent-gold text-lg ">{{ price }}</span>
      
      {% if not sold_out %}
      <span class="text-[10px] uppercase tracking-widest text-white group-hover:text-accent-gold transition-colors">
        View Details
      </span>
      {% else %}
      <span class="text-[10px] uppercase tracking-widest text-slate-500 cursor-not-allowed">
        Closed
      </span>
      {% endif %}
    </div>
  </div>

</a>
