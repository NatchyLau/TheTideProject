{% load static %}

<section
  id="facilities"
  class="py-24 md:py-32 bg-white border-t border-slate-100 overflow-hidden"
>
  <div class="container mx-auto px-6 mb-16 md:mb-20">
    <div
      class="flex flex-col md:flex-row md:items-end justify-between gap-6 reveal"
    >
      <div class="max-w-2xl">
        <span
          class="inline-block py-1 px-3 border border-premium-200 rounded-full text-[10px] font-bold tracking-[0.2em] uppercase text-premium-500 mb-4 bg-premium-50"
        >
          Exclusive Living
        </span>
        <h2
          class="font-serif text-4xl md:text-5xl lg:text-6xl text-premium-900 leading-tight"
        >
          Premium <span class="italic text-accent-gold">Facilities</span>
        </h2>
      </div>
      <p
        class="text-premium-400 font-light text-base md:text-lg max-w-sm leading-relaxed text-left md:text-right"
      >
        ยกระดับคุณภาพชีวิต...<br />ด้วยพื้นที่ส่วนกลางที่คิดมาเพื่อคุณ
      </p>
    </div>
  </div>

  <div class="container mx-auto px-4 md:px-6">
    <div
      class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 h-auto md:h-[600px]"
    >
      <div
        class="group relative md:col-span-2 md:row-span-2 rounded-2xl overflow-hidden reveal shadow-sm hover:shadow-2xl transition-all duration-700"
      >
        <img
          src="{% static 'core/images/pool.png' %}"
          alt="Infinity Pool"
          class="w-full h-full object-cover transition-transform duration-[1.5s] ease-[cubic-bezier(0.25,1,0.5,1)] group-hover:scale-110"
        />
        <div
          class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-80 transition-opacity duration-500"
        ></div>

        <div
          class="absolute bottom-0 left-0 p-8 w-full transform translate-y-2 group-hover:translate-y-0 transition-transform duration-500"
        >
          <div
            class="flex items-center justify-between border-t border-white/20 pt-4"
          >
            <div>
              <h3
                class="font-serif text-3xl md:text-4xl text-white italic mb-1"
              >
                Swimming Pool
              </h3>
              <p class="text-sm font-light text-white/80 tracking-wide">
                สระว่ายน้ำระบบเกลือ
              </p>
            </div>
           

          </div>
        </div>
      </div>

            <div
        class="group relative md:col-span-1 md:row-span-2 rounded-2xl overflow-hidden reveal shadow-sm hover:shadow-2xl transition-all duration-700 delay-100 min-h-[300px]"
      >
        <img
          src="{% static 'core/images/fitness-3.png' %}"
          alt="Fitness"
          class="w-full h-full object-cover transition-transform duration-[1.5s] ease-[cubic-bezier(0.25,1,0.5,1)] group-hover:scale-110"
        />
        <div
          class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors duration-500"
        ></div>

        <div class="absolute bottom-6 left-6 text-white">
          <h3 class="font-serif text-xl mb-1">Fitness</h3>
          <div
            class="w-8 h-[1px] bg-white/50 group-hover:w-full group-hover:bg-accent-gold transition-all duration-500"
          ></div>
        </div>
      </div>

      <div
        class="group relative md:col-span-1 md:row-span-1 rounded-2xl overflow-hidden reveal shadow-sm hover:shadow-2xl transition-all duration-700 delay-200 min-h-[280px]"
      >
        <img
          src="{% static 'core/images/co-working.png' %}"
          alt="Co-Working Space"
          class="w-full h-full object-cover transition-transform duration-[1.5s] ease-[cubic-bezier(0.25,1,0.5,1)] group-hover:scale-110"
        />
        <div
          class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors duration-500"
        ></div>
        <div class="absolute bottom-6 left-6 text-white">
          <h3 class="font-serif text-xl mb-1">Co-Working</h3>
          <div
            class="w-8 h-[1px] bg-white/50 group-hover:w-full group-hover:bg-accent-gold transition-all duration-500"
          ></div>
        </div>
      </div>

      <div
        class="group relative md:col-span-1 md:row-span-1 rounded-2xl overflow-hidden reveal shadow-sm hover:shadow-2xl transition-all duration-700 delay-300 min-h-[280px]"
      >
        <img
          src="{% static 'core/images/public.png' %}"
          alt="Public Park"
          class="w-full h-full object-cover transition-transform duration-[1.5s] ease-[cubic-bezier(0.25,1,0.5,1)] group-hover:scale-110"
        />
        <div
          class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors duration-500"
        ></div>
        <div class="absolute bottom-6 left-6 text-white">
          <h3 class="font-serif text-xl mb-1">Public Park</h3>
          <div
            class="w-8 h-[1px] bg-white/50 group-hover:w-full group-hover:bg-accent-gold transition-all duration-500"
          ></div>
          <p
            class="text-xs text-white/80 mt-2 font-light opacity-0 group-hover:opacity-100 transition-opacity duration-500 delay-100"
          >
            พื้นที่สีเขียวและสวนพักผ่อน
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
