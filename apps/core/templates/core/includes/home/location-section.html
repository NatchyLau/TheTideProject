{% load static %}

<section
  id="location"
  class="py-24 md:py-32 bg-white relative border-b border-slate-100 overflow-hidden min-h-screen"
>
  <div class="container mx-auto px-6 relative z-10">
    <div class="flex flex-col lg:flex-row gap-12 lg:gap-20">

          <span

            Prime Locations

            Connect to <br />
            <span class="italic text-slate-400">Every Destination</span>
          </h2>

            เลือกดูพิกัดโครงการที่คุณสนใจ<br />บนทำเลศักยภาพใจกลางเมือง
          </p>
        </div>

        <div class="space-y-4" id="location-tabs">
          <button
            onclick="switchMap('map-grand')"

              >
                <span class="font-serif font-bold text-lg">01</span>
              </div>
              <div>
                <h4
                  class="text-premium-900 font-medium group-[.active]:text-accent-gold transition-colors"
                >
                  The Tide Grand Nawong
                </h4>
                <p class="text-xs text-slate-500">นาวง, นครศรีธรรมราช</p>
              </div>
            </div>
            <svg
              class="w-5 h-5 text-slate-400 group-[.active]:text-accent-gold opacity-0 group-[.active]:opacity-100 transition-all duration-300"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5l7 7-7 7"
              ></path>
            </svg>

            data-target="map-privilege"
          >
            <div class="flex items-center gap-4">
              <div
                class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 group-hover:text-accent-gold group-[.active]:bg-accent-gold group-[.active]:text-white transition-colors"
              >
                <span class="font-serif font-bold text-lg">02</span>
              </div>
              <div>
                <h4
                  class="text-premium-900 font-medium group-[.active]:text-accent-gold transition-colors"
                >
                  The Tide Privilege
                </h4>
                <p class="text-xs text-slate-500">เทิดพระเกียรติ</p>
              </div>
            </div>
            <svg
              class="w-5 h-5 text-slate-400 group-[.active]:text-accent-gold opacity-0 group-[.active]:opacity-100 transition-all duration-300"

              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"

                stroke-width="2"
                d="M9 5l7 7-7 7"

          <button
            onclick="switchMap('map-signature')"

            data-target="map-signature"

              >

              </div>
              <div>
                <h4

                  The Tide Grand
                </h4>
                <p class="text-xs text-slate-500">พุทธภูมิ, นครศรีธรรมราช</p>
              </div>
            </div>
            <svg

              stroke="currentColor"

              <path

              src="https://www.google.com/maps?q=8.4018216,99.9465077&hl=en&z=17&output=embed"
            >
            </iframe>
            <div
              class="absolute bottom-6 left-6 bg-white/90 backdrop-blur-md px-5 py-4 rounded-lg border-l-4 border-accent-gold shadow-lg"
            >
              <p
                class="text-[10px] text-accent-gold uppercase tracking-widest font-bold mb-1"
              >

              </p>
              <p class="text-premium-900 font-serif text-lg mb-3">

              <a

              >
                <div

                >
                  <svg

                      d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
                    ></path>

              </a>
            </div>
          </div>

          <div
            id="map-signature"
            class="map-pane absolute inset-0 transition-opacity duration-500 opacity-0 z-0 pointer-events-none"
          >
            <iframe
              title="Grand Phutthaphum Map"
              class="w-full h-full"
              loading="lazy"
              src="https://www.google.com/maps?q=8.4127833,99.9604217&hl=en&z=16&output=embed"
            >
            </iframe>

            <div
              class="absolute bottom-6 left-6 bg-white/90 backdrop-blur-md px-5 py-4 rounded-lg border-l-4 border-accent-gold shadow-lg"
            >
              <p
                class="text-[10px] text-accent-gold uppercase tracking-widest font-bold mb-1"
              >
                Location
              </p>
              <p class="text-premium-900 font-serif text-lg mb-3">
                The Tide Grand Phutthaphum
              </p>

              <a
                href="https://www.google.com/maps/dir/?api=1&destination=8.4127833,99.9604217"
                target="_blank"
                class="inline-flex items-center gap-2 text-xs font-bold text-slate-500 hover:text-accent-gold transition-colors group/btn"
              >
                <div
                  class="w-8 h-8 rounded-full bg-slate-100 group-hover/btn:bg-accent-gold group-hover/btn:text-white flex items-center justify-center transition-colors"
                >
                  <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
                    ></path>
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"

                  </svg>

    </div>
  </div>
</section>

<script>
  function switchMap(mapId) {
    // อัปเดต Logic JS ให้เปลี่ยน Class สำหรับ Light Mode

    document.querySelectorAll(".location-tab").forEach((btn) => {
      // เอาสถานะ Active ออก (กลับไปเป็นพื้นใส)
      btn.classList.remove(
        "active",
        "bg-white",
        "shadow-sm",
        "border-slate-200",
      );
      btn.classList.add("bg-transparent", "border-transparent");

      // Reset ตัวเลข (กลับไปเป็นสีเทา)
      const numBg = btn.querySelector("div > div");
      numBg.classList.remove("bg-accent-gold", "text-white");
      numBg.classList.add("bg-slate-100", "text-slate-400");
    });

    // ใส่สถานะ Active ให้ปุ่มที่กด (พื้นขาว มีเงา)
    const activeBtn = document.querySelector(`button[data-target="${mapId}"]`);
    activeBtn.classList.add(
      "active",
      "bg-white",
      "shadow-sm",
      "border-slate-200",
    );
    activeBtn.classList.remove("bg-transparent", "border-transparent");

    // Highlight ตัวเลข (สีทอง)
    const activeNumBg = activeBtn.querySelector("div > div");
    activeNumBg.classList.remove("bg-slate-100", "text-slate-400");
    activeNumBg.classList.add("bg-accent-gold", "text-white");

    // จัดการ Map pane (เหมือนเดิม)
    document.querySelectorAll(".map-pane").forEach((map) => {
      map.classList.remove("opacity-100", "z-10");
      map.classList.add("opacity-0", "z-0", "pointer-events-none");
    });

    const targetMap = document.getElementById(mapId);
    targetMap.classList.remove("opacity-0", "z-0", "pointer-events-none");
    targetMap.classList.add("opacity-100", "z-10");
  }
</script>
