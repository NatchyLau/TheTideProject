  <div class="container mx-auto px-6 py-3 relative z-20">

          <a href="#home" class="nav-item group/link relative py-2">

      >
      <a
        href="#about"
        class="mobile-nav-link text-lg font-light tracking-[0.2em] text-white/90 hover:text-accent-gold transition-colors duration-300 border-b border-white/5 w-full pb-4"

      <a
        href="#projects"
        class="mobile-nav-link text-lg font-light tracking-[0.2em] text-white/90 hover:text-accent-gold transition-colors duration-300 border-b border-white/5 w-full pb-4"

      <a

        class="mobile-nav-link text-lg font-light tracking-[0.2em] text-white/90 hover:text-accent-gold transition-colors duration-300 border-b border-white/5 w-full pb-4"

      <div class="w-full flex flex-col gap-3 mt-6">

          class="mobile-nav-link text-sm font-medium tracking-widest text-premium-900 bg-accent-gold px-6 py-3 rounded-full hover:bg-white transition-colors duration-300 uppercase w-full text-center"

        </a>
      <a
        href="https://m.me/TheTideProperties"
        target="_blank"
        class="mobile-nav-link text-sm font-medium tracking-widest text-white border border-[#1877F2] hover:bg-[#1877F2] px-6 py-3 rounded-full transition-colors duration-300 uppercase w-full text-center flex items-center justify-center gap-2"
