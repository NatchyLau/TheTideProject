{% load static %}

<section class="relative py-32 lg:py-40 bg-premium-900 overflow-hidden isolate">
    
    <div class="absolute inset-0 -z-20">
        <img src="https://images.unsplash.com/photo-1600607687644-c7171b42498b?auto=format&fit=crop&q=80&w=2000" 
             alt="Luxury Living" 
             class="w-full h-full object-cover opacity-30 select-none grayscale-[20%]">
    </div>

    <div class="absolute inset-0 bg-gradient-to-t from-premium-900 via-premium-900/90 to-premium-900/60 -z-10"></div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-accent-gold/10 via-transparent to-transparent -z-10"></div>

    <div class="container mx-auto px-8 relative z-10">
        <div class="max-w-4xl mx-auto text-center reveal">
            
            <div class="flex justify-center mb-10">
                <div class="w-[1px] h-20 bg-gradient-to-b from-transparent via-accent-gold to-transparent"></div>
            </div>

            <span class="inline-block py-1 px-4 border border-white/10 rounded-full bg-white/5 backdrop-blur-md text-[10px] font-bold tracking-[0.3em] uppercase text-accent-gold mb-8 shadow-lg">
                Exclusive Invitation
            </span>
            
            <h3 class="font-serif text-4xl md:text-6xl text-white mb-8 leading-tight">
                Experience the Art of <br>
                <span class="italic font-light text-accent-gold">True Living</span>
            </h3>

            <p class="text-premium-300 font-light text-base md:text-lg max-w-xl mx-auto mb-12 leading-relaxed opacity-90">
                สัมผัสบรรยากาศจริงและรับคำปรึกษาพิเศษจากทีมงานผู้เชี่ยวชาญ <br class="hidden md:block">
                เพื่อค้นหาบ้านที่สะท้อนตัวตนและความสำเร็จของคุณ
            </p>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-6">
                
                <a href="{% url 'core:home' %}#contact-form" class="group relative px-10 py-5 bg-white text-premium-900 text-[11px] font-bold tracking-[0.25em] uppercase hover:bg-accent-gold hover:text-white transition-all duration-500 min-w-[240px] overflow-hidden">
                    <span class="relative z-10 flex items-center justify-center gap-3">
                        Book Private Viewing
                        <svg class="w-4 h-4 transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                    </span>
                </a>

                <a href="{% url 'core:home' %}#projects" class="group px-10 py-5 bg-transparent border border-white/20 text-white text-[11px] font-bold tracking-[0.25em] uppercase hover:border-accent-gold hover:text-accent-gold transition-all duration-500 min-w-[240px]">
                    View All Collections
                </a>
            </div>

            <div class="mt-16 pt-8 border-t border-white/5 flex flex-col md:flex-row justify-center items-center gap-8 md:gap-16 text-premium-400">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-accent-gold">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                    </div>
                    <div>
                        <span class="block text-[9px] uppercase tracking-widest opacity-50">Sales Gallery</span>
                        <span class="font-sans text-sm text-white tracking-wide">0xx-xxx-xxxx</span>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-accent-gold">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                    </div>
                    <div>
                        <span class="block text-[9px] uppercase tracking-widest opacity-50">Line Official</span>
                        <span class="font-sans text-sm text-white tracking-wide">@TheTideProject</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
