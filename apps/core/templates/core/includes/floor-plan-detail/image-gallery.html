<!-- Room Filter Tabs -->
{% load static %}

<div class="flex flex-wrap gap-8 mb-10 border-b border-premium-200/50">
    {% for room_key in plan.room_images.keys %}
    <button onclick="filterRoom('{{ room_key }}')" 
            class="room-filter pb-4 text-[10px] font-medium uppercase tracking-[0.2em] {% if forloop.first %}active{% endif %}"
            data-room="{{ room_key }}">
        {% if room_key == 'all' %}Overview{% else %}{{ room_key }}{% endif %}
    </button>
    {% endfor %}
</div>

<!-- Main Image -->
<div class="relative aspect-[16/10] bg-premium-100 overflow-hidden mb-6 group">
    <img id="main-image" 
         src="{% static plan.images.0 %}" 
         class="w-full h-full object-cover transition-transform duration-[2s] ease-out group-hover:scale-105"
         alt="{{ plan.title }}">
    
    <div class="absolute bottom-8 left-8 flex items-center gap-4">
        <div id="image-label" class="bg-premium-900/90 text-white px-5 py-2.5 text-[10px] tracking-widest uppercase backdrop-blur-md">
            Exterior View
        </div>
        <div id="image-counter" class="bg-white/90 px-4 py-2.5 text-[10px] font-medium tracking-tighter border border-premium-200">
            1 / {{ plan.images|length }}
        </div>
    </div>
</div>

<!-- Thumbnail Gallery -->
<div id="thumbnail-gallery" class="flex gap-4 overflow-x-auto no-scrollbar snap-x">
    {% for image in plan.images %}
    <div onclick="changeImage({{ forloop.counter0 }})" 
         class="gallery-thumb flex-shrink-0 w-24 h-24 cursor-pointer opacity-50 hover:opacity-100 transition-all duration-500 {% if forloop.first %}active opacity-100{% endif %}">
        <img src="{% static image %}" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700">
    </div>
    {% endfor %}
</div>
