<header class="mb-12">
    <div class="flex items-center gap-4 mb-6">
        <span class="h-[1px] w-12 bg-accent-gold"></span>
        <span class="text-[11px] font-semibold tracking-[0.3em] uppercase text-accent-gold">{{ plan.badge }}</span>
    </div>
    <h1 class="font-serif text-5xl md:text-6xl text-premium-900 leading-[1.1] mb-6">
        {{ plan.title }}
    </h1>
    <div class="flex items-baseline gap-4 border-t border-premium-200 pt-8 mt-8">
        <span class="text-[10px] uppercase tracking-widest text-premium-500">Starting from</span>
        <span class="font-serif text-4xl text-premium-900">{{ plan.price }}</span>
        <span class="text-xs text-premium-500 italic">Million Baht</span>
    </div>
</header>
