<div class="grid grid-cols-2 gap-px bg-premium-200 border border-premium-200 mb-12">
    <div class="bg-premium-50 p-8 flex flex-col gap-2">
        <span class="text-[10px] uppercase tracking-widest text-premium-500">Area</span>
        <span class="text-lg font-light">{{ plan.area }} <small class="text-[10px]">SQ.M.</small></span>
    </div>
    <div class="bg-premium-50 p-8 flex flex-col gap-2">
        <span class="text-[10px] uppercase tracking-widest text-premium-500">Bedrooms</span>
        <span class="text-lg font-light">{{ plan.beds }} Units</span>
    </div>
    <div class="bg-premium-50 p-8 flex flex-col gap-2">
        <span class="text-[10px] uppercase tracking-widest text-premium-500">Bathrooms</span>
        <span class="text-lg font-light">{{ plan.baths }} Units</span>
    </div>
    <div class="bg-premium-50 p-8 flex flex-col gap-2">
        <span class="text-[10px] uppercase tracking-widest text-premium-500">Parking</span>
        <span class="text-lg font-light">{{ plan.parking }} Cars</span>
    </div>
</div>
