<div class="md:bg-white md:rounded-2xl md:shadow-lg md:border md:border-slate-100 md:overflow-hidden">
    <div class="w-full">
        <table class="w-full block md:table">
            <thead class="hidden md:table-header-group bg-slate-50 border-b border-slate-200">
                <tr>
                    <th class="px-6 py-4 text-left text-sm font-semibold text-slate-700">วันที่</th>
                    <th class="px-6 py-4 text-left text-sm font-semibold text-slate-700">ชื่อ-นามสกุล</th>
                    <th class="px-6 py-4 text-left text-sm font-semibold text-slate-700">เบอร์โทร</th>
                    <th class="px-6 py-4 text-left text-sm font-semibold text-slate-700">งบประมาณ</th>
                    <th class="px-6 py-4 text-left text-sm font-semibold text-slate-700">วันที่สะดวก</th>
                    <th class="px-6 py-4 text-left text-sm font-semibold text-slate-700">สถานะ</th>
                    <th class="px-6 py-4 text-center text-sm font-semibold text-slate-700">จัดการ</th>
                </tr>
            </thead>
            <tbody id="inquiry-table-body" class="block md:table-row-group md:divide-y md:divide-slate-100">
                {% for inquiry in inquiries %}
                {% include 'accounts/partials/inquiry_row.html' %}
                {% empty %}
                <tr class="block md:table-row bg-white rounded-xl md:bg-transparent p-6 md:p-0">
                    <td colspan="7" class="block md:table-cell px-6 py-12 text-center text-slate-500">
                        <svg class="w-16 h-16 mx-auto mb-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                        </svg>
                        <p class="text-lg font-medium">ไม่พบข้อมูล</p>
                        <p class="text-sm">ลองเปลี่ยนตัวกรองหรือค้นหาใหม่</p>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
