services:
  web:
    image: ghcr.io/yootapichai/thetide-app:latest
    command: gunicorn --bind 0.0.0.0:8000 --worker-class gthread --workers 2 --threads 2 the_tide_project.wsgi:application
    expose:
      - 8000
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      - db 
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
   postgres_data:
   static_volume: