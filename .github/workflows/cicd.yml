name: cicd
on:
  push:
    branches: ["main", "develop", "test_deployment", "concrete"]

permissions:
  contents: read
  packages: write
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      static_only: ${{ steps.changes.outputs.static_only }}
      static_changed: ${{ steps.changes.outputs.static_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          CURRENT_SHA="${{ github.sha }}"

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "$CURRENT_SHA")
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -q '^subdomain_concrete/'; then
            echo "static_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "static_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$CHANGED_FILES" ] && echo "$CHANGED_FILES" | grep -qv '^subdomain_concrete/'; then
            echo "static_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "static_only=true" >> "$GITHUB_OUTPUT"
          fi

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  build-and-deploy:
    needs: [detect-changes, secret-scan]
    if: needs.detect-changes.outputs.static_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
          
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ secrets.GH_USERNAME }}/thetide-app:latest
            ghcr.io/${{ secrets.GH_USERNAME }}/thetide-app:${{ github.sha }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ secrets.GH_USERNAME }}/thetide-app:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          scanners: vuln

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ secrets.GH_USERNAME }}/thetide-app:${{ github.sha }}
          docker push ghcr.io/${{ secrets.GH_USERNAME }}/thetide-app:latest

      # --- ส่วน Deploy ---
      - name: Create deployment .env file
        env:
          MY_ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          echo "$MY_ENV_FILE" > .env
          
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Necessary Files to Server
        run: |
          # สร้าง folder ปลายทาง
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ~/webapp && rm -rf ~/webapp/subdomain_concrete"
          # Copy ไฟล์ config, static site และ .env สำหรับ docker compose บน server
          scp -r ./nginx docker-compose.yml ./subdomain_concrete ./.env ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/webapp

      - name: Deploy to Server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd webapp
            
            # Login
            echo "${{ secrets.GH_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GH_USERNAME }} --password-stdin
            
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T web python manage.py collectstatic --noinput
            docker compose restart nginx
            docker image prune -f
          EOF

  deploy-static-only:
    needs: [detect-changes, secret-scan]
    if: needs.detect-changes.outputs.static_only == 'true' && needs.detect-changes.outputs.static_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Concrete Static Files to Server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ~/webapp && rm -rf ~/webapp/subdomain_concrete"
          scp -r ./subdomain_concrete ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/webapp

      - name: Restart Nginx Container Only
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd webapp
            docker compose up -d --no-deps nginx
            docker compose restart nginx
          EOF
