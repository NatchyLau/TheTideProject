upstream django_app {
    # 'web' คือชื่อ service ของ django ใน docker-compose
    server web:8000;
}

server {
    listen 80;

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin $http_origin;
    }
}

# --- Concrete subdomain (Static HTML) ---
server {
    listen 80;
    server_name concrete.thetidegroupnst.com;

    location / {
        root /usr/share/nginx/subdomain_concrete;
        index index.html;
    }
}